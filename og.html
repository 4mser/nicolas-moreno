<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG — Nicolás Moreno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* Placa OG 1200×630. Misma paleta del sitio: bg #050403, acento ámbar. */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#050403}
  body{position:relative;font-family:'IBM Plex Sans',sans-serif;color:#e8e2d6}
  canvas{position:absolute;inset:0}
  /* canvas es replaced element: inset NO lo estira, fijar tamaño CSS explícito */
  #sky{z-index:0;width:1200px;height:630px}

  .frame{position:absolute;inset:26px;border:1px solid rgba(255,179,71,.14);z-index:3;pointer-events:none}
  .frame i{position:absolute;width:14px;height:14px;border:1px solid rgba(255,179,71,.55)}
  .frame i:nth-child(1){top:-1px;left:-1px;border-right:0;border-bottom:0}
  .frame i:nth-child(2){top:-1px;right:-1px;border-left:0;border-bottom:0}
  .frame i:nth-child(3){bottom:-1px;left:-1px;border-right:0;border-top:0}
  .frame i:nth-child(4){bottom:-1px;right:-1px;border-left:0;border-top:0}

  .col{position:absolute;left:78px;top:96px;width:560px;z-index:4}
  .eyebrow{display:flex;align-items:center;gap:12px;font-family:'IBM Plex Mono',monospace;
    font-size:13px;font-weight:500;letter-spacing:.24em;color:#ffb347;text-transform:uppercase}
  .eyebrow b{width:7px;height:7px;border-radius:50%;background:#ffb347;
    box-shadow:0 0 10px 2px rgba(255,179,71,.8)}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:118px;line-height:.98;
    letter-spacing:-.015em;margin-top:34px;color:#f4efe6}
  h1 em{display:block;font-style:italic;font-weight:500;color:#ffb347}
  .sub{margin-top:38px;font-weight:300;font-size:23.5px;line-height:1.5;color:#b9b2a4;max-width:500px}
  .sub em{font-family:'Fraunces',serif;font-style:italic;font-weight:400;color:#ffd9a3}
  .roles{position:absolute;left:78px;bottom:88px;z-index:4;font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;font-weight:500;letter-spacing:.13em;color:#948b78;text-transform:uppercase}
  .roles i{font-style:normal;color:#ffb347;padding:0 10px}

  .plate{position:absolute;right:64px;top:70px;width:452px;height:452px;z-index:4}
  .plate .well{position:absolute;inset:0;border:1px solid rgba(255,179,71,.3);background:#070503;overflow:hidden}
  .plate canvas{position:absolute;left:0;top:0;width:450px;height:450px}
  .plate .tick{position:absolute;width:15px;height:15px;border:1px solid rgba(255,217,163,.75)}
  .tick.tl{top:-4px;left:-4px;border-right:0;border-bottom:0}
  .tick.tr{top:-4px;right:-4px;border-left:0;border-bottom:0}
  .tick.bl{bottom:-4px;left:-4px;border-right:0;border-top:0}
  .tick.br{bottom:-4px;right:-4px;border-left:0;border-top:0}
  .plate-top{position:absolute;left:2px;top:-26px;width:100%;display:flex;justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.2em;color:#948b78}
  .plate-top b{color:#ffb347;font-weight:600}
  .plate-cap{position:absolute;left:2px;bottom:-30px;width:100%;display:flex;justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.18em;color:#948b78}

  .foot{position:absolute;left:78px;right:78px;bottom:44px;z-index:4;display:flex;
    justify-content:space-between;align-items:center;border-top:1px solid rgba(255,179,71,.16);
    padding-top:16px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:500;
    letter-spacing:.16em;text-transform:uppercase}
  .foot .l{color:#948b78}
  .foot .r{color:#ffb347}
</style>
</head>
<body>

<canvas id="sky" width="2400" height="1260"></canvas>
<div class="frame"><i></i><i></i><i></i><i></i></div>

<div class="col">
  <div class="eyebrow"><b></b>Observatory Log · Entry N° 001</div>
  <h1>Nicolás <em>Moreno.</em></h1>
  <p class="sub">I studied physics to understand the world. <em>I write code to get inside it.</em></p>
</div>

<div class="roles">FIDELYA <i>·</i> B&amp;N SOLUTIONS <i>·</i> GOAUTO</div>

<div class="plate">
  <div class="well"><canvas id="sim" width="904" height="904"></canvas></div>
  <span class="tick tl"></span><span class="tick tr"></span>
  <span class="tick bl"></span><span class="tick br"></span>
  <div class="plate-top"><span><b>LAB</b> — 38 EXPERIMENTS</span><span>PLATE 002</span></div>
  <div class="plate-cap"><span>|ψ|² · LORENZ σ10 ρ28</span><span>SANTIAGO · CHILE</span></div>
</div>

<div class="foot">
  <span class="l">Software Engineer · Founder · Santiago, Chile</span>
  <span class="r">nicolas-moreno.vercel.app</span>
</div>

<script>
// PRNG con semilla fija: la placa sale idéntica en cada render.
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ── Cielo de fondo: estrellas + grilla de carta astronómica ── */
(function(){
  const c=document.getElementById('sky'),x=c.getContext('2d');x.scale(2,2);
  const R=mulberry32(4208);
  // Grilla punteada muy tenue
  x.strokeStyle='rgba(255,179,71,.05)';x.setLineDash([1,7]);x.lineWidth=1;
  for(let gx=0;gx<=1200;gx+=100){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,630);x.stroke()}
  for(let gy=0;gy<=630;gy+=100){x.beginPath();x.moveTo(0,gy);x.lineTo(1200,gy);x.stroke()}
  x.setLineDash([]);
  // Polvo de estrellas
  for(let i=0;i<340;i++){
    const sx=R()*1200,sy=R()*630,r=R();
    x.fillStyle=`rgba(255,${230-R()*60|0},${180-R()*60|0},${.08+r*.5})`;
    x.beginPath();x.arc(sx,sy,r<.94?R()*.9+.3:R()*1.5+.8,0,7);x.fill();
  }
  // Tres estrellas con destello en cruz, lejos del texto
  [[200,58],[445,80],[1162,95]].forEach(([sx,sy],i)=>{
    const g=x.createRadialGradient(sx,sy,0,sx,sy,16);
    g.addColorStop(0,'rgba(255,220,170,.95)');g.addColorStop(.25,'rgba(255,179,71,.35)');
    g.addColorStop(1,'rgba(255,179,71,0)');
    x.fillStyle=g;x.beginPath();x.arc(sx,sy,16,0,7);x.fill();
    x.strokeStyle='rgba(255,225,180,.55)';x.lineWidth=1;const L=i?10:16;
    x.beginPath();x.moveTo(sx-L,sy);x.lineTo(sx+L,sy);x.moveTo(sx,sy-L);x.lineTo(sx,sy+L);x.stroke();
  });
  // Viñeta
  const v=x.createRadialGradient(600,315,220,600,315,760);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');
  x.fillStyle=v;x.fillRect(0,0,1200,630);
})();

/* ── Placa: interferencia |ψ|² de dos fuentes + Lorenz proyectado ── */
(function(){
  const c=document.getElementById('sim'),x=c.getContext('2d');x.scale(2,2);
  const W=452,H=452;

  // Campo de interferencia calculado por pixel en baja resolución
  const N=151,cell=W/N,k=2*Math.PI/30;
  const S=[[W*.26,H*.30],[W*.72,H*.58]];
  for(let iy=0;iy<N;iy++)for(let ix=0;ix<N;ix++){
    const px=(ix+.5)*cell,py=(iy+.5)*cell;
    let re=0,im=0;
    for(const[sx,sy]of S){
      const d=Math.hypot(px-sx,py-sy),a=1/Math.sqrt(d*.35+9);
      re+=a*Math.cos(k*d);im+=a*Math.sin(k*d);
    }
    const t=Math.min(1,Math.pow((re*re+im*im)*9,1.15));
    x.fillStyle=`rgba(${255*t|0},${(179*t+16)|0},${(71*t+6)|0},${.04+t*.26})`;
    x.fillRect(ix*cell,iy*cell,cell+.6,cell+.6);
  }
  // Marcas de las dos fuentes
  S.forEach(([sx,sy])=>{
    x.strokeStyle='rgba(255,217,163,.85)';x.lineWidth=1;
    x.beginPath();x.arc(sx,sy,4,0,7);x.stroke();
    x.beginPath();x.moveTo(sx-8,sy);x.lineTo(sx+8,sy);x.moveTo(sx,sy-8);x.lineTo(sx,sy+8);x.stroke();
  });

  // Lorenz: σ=10, ρ=28, β=8/3, RK4 estable, proyectado (x,z) y auto-ajustado
  const s=10,r=28,b=8/3,dt=.01;
  const F=([px,py,pz])=>[s*(py-px),px*(r-pz)-py,px*py-b*pz];
  const add=(u,v,h)=>[u[0]+v[0]*h,u[1]+v[1]*h,u[2]+v[2]*h];
  let p=[.9,0,20];
  const pts=[];
  for(let i=0;i<11000;i++){
    const k1=F(p),k2=F(add(p,k1,dt/2)),k3=F(add(p,k2,dt/2)),k4=F(add(p,k3,dt));
    p=[0,1,2].map(j=>p[j]+dt/6*(k1[j]+2*k2[j]+2*k3[j]+k4[j]));
    if(i>600)pts.push([p[0],p[2]]);
  }
  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
  for(const[px,pz]of pts){
    if(px<x0)x0=px;if(px>x1)x1=px;
    if(pz<z0)z0=pz;if(pz>z1)z1=pz;
  }
  const pad=52,sc=Math.min((W-2*pad)/(x1-x0),(H-2*pad)/(z1-z0));
  const ox=(W-(x1-x0)*sc)/2-x0*sc,oy=(H+(z1-z0)*sc)/2+z0*sc;
  const P=([px,pz])=>[px*sc+ox,oy-pz*sc];
  x.lineWidth=.6;x.strokeStyle='rgba(255,236,205,.38)';
  x.beginPath();
  pts.forEach((q,i)=>{const[gx,gy]=P(q);i?x.lineTo(gx,gy):x.moveTo(gx,gy)});
  x.stroke();
  x.lineWidth=1.3;x.strokeStyle='rgba(255,179,71,.75)';
  x.beginPath();
  pts.slice(-1500).forEach((q,i)=>{const[gx,gy]=P(q);i?x.lineTo(gx,gy):x.moveTo(gx,gy)});
  x.stroke();

  // Regla graduada del borde de placa
  x.strokeStyle='rgba(255,179,71,.35)';x.lineWidth=1;
  for(let gx=0;gx<=W;gx+=22.6){
    const tk=Math.round(gx/22.6)%5===0?7:3.5;
    x.beginPath();x.moveTo(gx,H);x.lineTo(gx,H-tk);x.stroke();
    x.beginPath();x.moveTo(0,gx);x.lineTo(tk,gx);x.stroke();
  }
})();
</script>
</body>
</html>
